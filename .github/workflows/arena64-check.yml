name: Arena64 verification
on:
  push:
    branches:
      - codex/arena64
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l arena64.go arena64_test.go)"
      - run: go test ./...
      - run: go test -race -run '^TestArena64' ./...
      - run: go vet ./...
      - run: go test -run '^$' -bench '^(BenchmarkArena64AllocFree|BenchmarkArena_Alloc_Sequential|BenchmarkArena_AllocFree_Parallel)$' -benchtime=1s ./...
