name: Shared arena
on:
  push:
    branches: [main, codex/shared-arena]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  arena:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - name: Format arena sources
        run: |
          gofmt -w arena.go arena_*.go arena
          python3 - <<'PY'
          import json,pathlib
          paths=[pathlib.Path('arena.go'),*pathlib.Path('.').glob('arena_*.go'),*pathlib.Path('arena').glob('*.go')]
          print('FORMATTED_FILES_JSON='+json.dumps({str(p):p.read_text() for p in paths},ensure_ascii=True))
          PY
      - name: Functional tests
        run: go test ./... -count=1 -timeout=180s
      - name: Race detector
        run: go test ./... -race -count=1 -timeout=180s
      - name: Pointer checks
        run: go test ./... -gcflags=all=-d=checkptr=2 -count=1 -timeout=180s
      - name: Vet
        run: go vet ./...
      - name: Ownership fuzzing
        run: go test . -run '^$' -fuzz '^FuzzArenaOwnership$' -fuzztime=20s -parallel=2
      - name: Cross compilation
        if: matrix.runner == 'ubuntu-24.04'
        run: |
          GOOS=linux GOARCH=arm64 go test -c . -o /tmp/utils-arm64.test
          GOOS=linux GOARCH=riscv64 go test -c . -o /tmp/utils-riscv64.test
